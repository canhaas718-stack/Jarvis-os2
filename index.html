<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS HUD Interface</title>
    <style>
        :root {
            --glow-color: #00f3ff;
            --bg-dark: #070b19;
            --hud-transparency: rgba(0, 243, 255, 0.15);
            --font-hud: 'Courier New', Courier, monospace;
            --accent-orange: #ff9900;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--glow-color);
            font-family: var(--font-hud);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-shadow: 0 0 10px var(--glow-color);
        }

        /* Hintergrundmuster & Scanline */
        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--hud-transparency) 1px, transparent 1px),
                linear-gradient(90deg, var(--hud-transparency) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 1;
        }

        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(0, 243, 255, 0.4);
            opacity: 0.6;
            animation: scan 6s linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        /* Hauptcontainer */
        .main-frame {
            position: relative;
            width: 85%;
            max-width: 900px;
            height: 70vh;
            border: 2px solid var(--glow-color);
            box-shadow: 0 0 25px var(--glow-color), inset 0 0 15px var(--glow-color);
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: rgba(7, 11, 25, 0.85);
            z-index: 2;
        }

        /* Ecken-Dekoration */
        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--glow-color);
        }
        .top-left { top: -5px; left: -5px; border-right: none; border-bottom: none; }
        .top-right { top: -5px; right: -5px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: -5px; left: -5px; border-right: none; border-top: none; }
        .bottom-right { bottom: -5px; right: -5px; border-left: none; border-top: none; }

        header {
            font-size: 1.8rem;
            text-align: center;
            letter-spacing: 5px;
            border-bottom: 2px solid var(--glow-color);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            flex-grow: 1;
        }

        /* Arc Reactor Status Widget */
        .arc-reactor {
            width: 30px;
            height: 30px;
            border: 2px dashed var(--glow-color);
            border-radius: 50%;
            animation: rotate 10s linear infinite;
            box-shadow: 0 0 10px var(--glow-color);
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        .output-console {
            flex-grow: 1;
            margin: 15px 0;
            overflow-y: auto;
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 15px;
            background: rgba(0, 243, 255, 0.03);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Animationsfeld für Websuche */
        .search-visualizer {
            border: 1px dashed var(--accent-orange);
            background: rgba(255, 153, 0, 0.05);
            color: var(--accent-orange);
            padding: 10px;
            font-size: 0.9rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.5s ease-in-out;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--accent-orange);
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: rotate 1s linear infinite;
        }

        .input-area {
            display: flex;
            gap: 10px;
            border-top: 2px solid var(--glow-color);
            padding-top: 15px;
            flex-direction: column;
        }

        input[type="password"], input[type="text"] {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--glow-color);
            color: var(--glow-color);
            padding: 10px;
            font-family: var(--font-hud);
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            box-shadow: 0 0 10px var(--glow-color);
        }

        .command-bar {
            display: flex;
            gap: 10px;
        }

        button {
            background: var(--glow-color);
            color: var(--bg-dark);
            border: none;
            padding: 10px 18px;
            font-family: var(--font-hud);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 0 10px var(--glow-color);
            transition: all 0.2s ease;
        }

        button:hover {
            background: #00c9d4;
            box-shadow: 0 0 20px var(--glow-color);
        }

        button.mic-btn {
            background: transparent;
            color: var(--glow-color);
            border: 1px solid var(--glow-color);
        }

        button.mic-btn.active {
            background: red;
            color: white;
            border-color: red;
            box-shadow: 0 0 15px red;
        }

        .status {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="hud-overlay"></div>
    <div class="scanline"></div>

    <div class="main-frame">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <header>
            <div class="arc-reactor"></div>
            <div class="header-title">JARVIS O.S.</div>
            <div class="arc-reactor"></div>
        </header>

        <div class="output-console" id="console-output">
            <p class="status">> Systeminitialisierung abgeschlossen...</p>
            <p class="status">> Modell: Llama 3.3 70B geladen.</p>
            <p class="status">> Bereit für Sprach- oder Texteingabe.</p>
            <div id="response-display"></div>
        </div>

        <div class="input-area">
            <input type="password" id="api-key" placeholder="Groq API-Schlüssel eingeben...">
            <div class="command-bar">
                <input type="text" id="user-input" placeholder="Befehl an JARVIS senden...">
                <button class="mic-btn" id="mic-btn" onclick="toggleVoiceInput()">🎤</button>
                <button onclick="processCommand()">SENDEN</button>
            </div>
        </div>
    </div>

    <script>
        let recognition = null;
        let isListening = false;

        // Männliche Stimme konfigurieren & ausgeben
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Vorherige Sprachausgabe stoppen
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'de-DE';
                utterance.pitch = 0.8; // Tieferer Ton für männliche Stimme
                utterance.rate = 1.0;

                // Versuchen, eine männliche deutsche Stimme auszuwählen
                const voices = window.speechSynthesis.getVoices();
                const maleVoice = voices.find(v => v.lang.includes('de') && (v.name.includes('Male') || v.name.includes('Stefan') || v.name.includes('Google Deutsch')));
                if (maleVoice) {
                    utterance.voice = maleVoice;
                }

                window.speechSynthesis.speak(utterance);
            }
        }

        // Sprach-zu-Text (Microphone Input)
        function toggleVoiceInput() {
            const micBtn = document.getElementById('mic-btn');
            
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Spracherkennung wird von diesem Browser nicht unterstützt.");
                return;
            }

            if (isListening) {
                recognition.stop();
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            recognition.continuous = false;

            recognition.onstart = function() {
                isListening = true;
                micBtn.classList.add('active');
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('user-input').value = transcript;
                processCommand();
            };

            recognition.onerror = function(event) {
                console.error("Spracherkennungsfehler: ", event.error);
            };

            recognition.onend = function() {
                isListening = false;
                micBtn.classList.remove('active');
            };

            recognition.start();
        }

        // Hilfsfunktion: Künstliche Verzögerung für Animationen
        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        async function processCommand() {
            const apiKey = document.getElementById('api-key').value;
            const input = document.getElementById('user-input').value;
            const display = document.getElementById('response-display');

            if (!apiKey) {
                alert("Bitte gib zuerst deinen API-Schlüssel ein.");
                return;
            }

            if (input.trim() !== '') {
                display.innerHTML += `<p style="color: var(--glow-color);">> ${input}</p>`;
                document.getElementById('user-input').value = '';

                // Visueller Lade- und Suchprozess
                const searchBox = document.createElement('div');
                searchBox.className = 'search-visualizer';
                searchBox.innerHTML = `<div class="spinner"></div><span id="search-status">Analysiere Anfrage...</span>`;
                display.appendChild(searchBox);

                const consoleElement = document.getElementById('console-output');
                consoleElement.scrollTop = consoleElement.scrollHeight;

                const searchStatus = document.getElementById('search-status');
                
                await sleep(800);
                searchStatus.innerText = "Durchsuche Datennetzwerk & Web-Quellen...";
                await sleep(1000);
                searchStatus.innerText = "Synthetisiere Informationen...";
                await sleep(600);

                try {
                    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${apiKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: 'llama-3.3-70b-versatile',
                            messages: [
                                { role: 'system', content: 'Du bist JARVIS, ein hochintelligenter KI-Assistent. Antworte präzise, professionell und im Stil von JARVIS aus Iron Man.' },
                                { role: 'user', content: input }
                            ]
                        })
                    });

                    const data = await response.json();
                    searchBox.remove();

                    if (data.choices && data.choices.length > 0) {
                        const reply = data.choices[0].message.content;
                        display.innerHTML += `<p style="color: white; border-left: 2px solid var(--glow-color); padding-left: 8px;">> ${reply}</p>`;
                        speakText(reply);
                    } else if (data.error) {
                        display.innerHTML += `<p style="color: red;">> Fehler: ${data.error.message}</p>`;
                    }
                } catch (error) {
                    searchBox.remove();
                    display.innerHTML += `<p style="color: red;">> Verbindungsfehler: ${error.message}</p>`;
                }

                consoleElement.scrollTop = consoleElement.scrollHeight;
            }
        }

        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                processCommand();
            }
        });

        // Stimmen beim Laden des Browsers initialisieren
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }
    </script>
</body>
</html>
